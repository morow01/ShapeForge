<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 544"
     width="512"
     height="544"
     role="img"
     aria-labelledby="title desc">
  <title id="title">ShapeForge SF cube logo</title>
  <desc id="desc">
    An isometric teal cube with an S-shaped left face,
    an F-shaped right face, subtle gradients and transparent gaps.
  </desc>

  <defs>
    <linearGradient id="top"
                    x1="48" y1="56" x2="448" y2="272"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#45b8bf"/>
      <stop offset="1" stop-color="#2ca3ad"/>
    </linearGradient>

    <linearGradient id="left"
                    x1="32" y1="174" x2="244" y2="512"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#39b0b9"/>
